[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idpn-model"
version = "0.1.0"
description = "Improving the Detection of Small Pulmonary Nodules in Chest X-Rays using Learnable Downsampling Techniques"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
